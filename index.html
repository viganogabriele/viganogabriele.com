<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link
      id="site-favicon"
      rel="icon"
      type="image/png"
      href="/favicon-light.png?v=4"
    />
    <script>
      (() => {
        const DARK_ICON = "/favicon-dark.png?v=4";
        const LIGHT_ICON = "/favicon-light.png?v=4";
        const link = document.getElementById("site-favicon");
        if (!link) return;

        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const applyFavicon = () => {
          link.setAttribute("href", media.matches ? DARK_ICON : LIGHT_ICON);
        };

        applyFavicon();
        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", applyFavicon);
        } else if (typeof media.addListener === "function") {
          media.addListener(applyFavicon);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriele Viganò — Computer Engineering Student</title>
    <meta
      name="description"
      content="Portfolio di Gabriele Viganò — ingegnere informatico, product lead di PoliNetwork, appassionato di sistemi, infrastrutture e design."
    />
    <meta name="theme-color" content="#060606" />
    <meta property="og:title" content="Gabriele Viganò" />
    <meta
      property="og:description"
      content="Computer Engineering Student & Product Lead @ PoliNetwork"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
