    <!-- The hero portrait frame is `hidden sm:block`, so below this width the
         image is never painted; without the condition the preload fetched it
         at high priority on every phone to render nothing. 40rem, not 640px:
         it has to agree with Tailwind's `sm:`, which compiles to
         `(width>=40rem)`. See HERO_PORTRAIT_MEDIA in src/lib/viewport.ts. -->
    <link rel="preload" as="image" href="/src/assets/gabriele-photo.avif" type="image/avif" fetchpriority="high" media="(min-width: 40rem)" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Every mobile performance mitigation in index.css hangs off this
         attribute instead of `(hover: none) and (pointer: coarse)`. That media
         query is not reliable on the browsers that need the mitigations most:
         in-app webviews (Telegram) and Brave — especially with "Desktop site"
         on — report hover/fine-pointer despite being touch-only, so the media
         query silently skipped every mitigation there while Safari got them
         all. That is why the hero grid kept animating (and the site kept
         stuttering) on Brave and Telegram but never on Safari.
         Runs before first paint so there is no flash of the desktop treatment. */
      try {
        if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
          const root = document.documentElement;
          root.setAttribute("data-touch", "true");
          /* Brave and embedded Chromium webviews can recalculate `svh` while
             their browser chrome collapses. Capture the initially visible
             height before first paint; runtime code refreshes it only when
             the viewport width changes (for example, on rotation). */
          const height = window.visualViewport?.height || window.innerHeight;
          root.style.setProperty("--stable-viewport-height", `${Math.round(height)}px`);
        }
      } catch (error) { /* attribute is an optimisation, never block boot */ }
    </script>

    <style data-static-home-shell-style>
      /* Mobile's first response carries the visible introduction while the
         application bundle starts. The real preloader remains above it and
         keeps its status/progress semantics; only its opaque backdrop moves
         aside on this one initial home navigation. */
      #static-home-shell { display: none; }
      @media (max-width: 39.999rem) {
        html[data-static-home-shell] #static-home-shell {
          position: fixed;
          inset: 0;
          z-index: 99;
          display: block;
          overflow: hidden;
          pointer-events: none;
          background-color: #080b16;
          background-image: linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
          background-position: -1px -1px;
          background-size: 64px 64px;
          color: #edf1ff;
          font-family: "Space Grotesk Variable", "Space Grotesk", system-ui, sans-serif;
        }
        html[data-static-home-shell] [data-preloader] {
          align-items: flex-end;
          padding-bottom: max(2rem, env(safe-area-inset-bottom));
          background-color: transparent;
        }
        .static-home-shell__content { padding: 7.5rem 1.25rem 3rem; }
        .static-home-shell__location {
          margin: 0;
          color: rgba(120,169,255,.75);
          font: 400 .875rem/1.25 "Space Mono", ui-monospace, monospace;
          letter-spacing: .18em;
          text-transform: uppercase;
        }
        .static-home-shell__location::before {
          display: inline-block;
          width: .375rem;
          height: .375rem;
          margin-right: .5rem;
          border-radius: 999px;
          background: #78a9ff;
          content: "";
          vertical-align: .12em;
        }
        .static-home-shell__title {
          max-width: 56rem;
          margin: 1rem 0 0;
          font-size: clamp(3.4rem,17vw,4.6rem);
          font-weight: 500;
          letter-spacing: -.09em;
          line-height: .8;
        }
        .static-home-shell__title span { display: block; }
        .static-home-shell__title span + span {
          padding-top: .12em;
          padding-left: .06em;
          color: #bcc4dc;
        }
        .static-home-shell__summary {
          max-width: 36rem;
          margin: 1.75rem 0 0;
          color: #bcc4dc;
          font-size: 1.25rem;
          font-weight: 500;
          letter-spacing: -.02em;
          line-height: 1.375;
        }
      }
    </style>
